version: v2
plugins:
  - local: [go, run, -buildvcs=false, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, -buildvcs=false, ./cmd/protoc-gen-keel]
    out: gen/go
    opt: [paths=source_relative, lang=go]
  - local: sdks/typescript/node_modules/.bin/protoc-gen-es
    out: sdks/typescript/src/gen
    opt: [target=ts, import_extension=js]
  - local: [go, run, -buildvcs=false, ./cmd/protoc-gen-keel]
    out: sdks/typescript/src/gen
    opt: [paths=source_relative, lang=typescript]
inputs:
  - directory: proto
