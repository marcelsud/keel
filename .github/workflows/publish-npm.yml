name: Publish TypeScript SDK

on:
  push:
    tags:
      - 'keel.ts-v*'
  workflow_dispatch:

concurrency: publish-keel-ts

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Select package version and npm tag
        id: package
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `keel.ts-v${version}`) {
            throw new Error(`SDK tag must match package.json: keel.ts-v${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${version.includes('-') ? 'next' : 'latest'}\n`);
          NODE
      - name: Install publishing tools
        run: npm install --global npm@11.18.0
      - name: Install SDK dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test, build, and publish SDK
        run: npm publish --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.package.outputs.dist-tag }}
